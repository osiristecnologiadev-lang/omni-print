# OmniPrint on the Hostinger VPS (/opt/omniprint). This machine ALSO runs
# Vortex (/opt/vortex, critical: a store sells through it). Rules this file
# follows - keep them when editing:
#   - own compose project ("omniprint"), own networks, own Postgres;
#   - NO published ports: the only way in is Vortex's Caddy, which joins
#     the "omniprint_edge" network (see Caddyfile.omniprint);
#   - every container has memory/CPU limits (the VPS has no swap and the
#     Vortex backend has no limit - OmniPrint must never starve it);
#   - capped json logs, so a chatty container can't fill the disk.
# Never run `docker system prune` / `volume prune` on this host.

name: omniprint

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: omniprint
      POSTGRES_DB: omniprint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Subdirectory, so the volume root's lost+found never trips initdb.
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
    shm_size: 256m
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniprint -d omniprint"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 2g, cpus: "1.5" }
    logging: *logging

  api:
    image: ghcr.io/osiristecnologiadev-lang/omni-print-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      TZ: UTC
      PORT: "3000"
      # Same pool cap as Railway (2026-10-02 "too many clients" incident).
      DATABASE_URL: postgresql://omniprint:${POSTGRES_PASSWORD}@db:5432/omniprint?connection_limit=20
      TRUST_PROXY: "1"
      # "true" while Railway is still production (no duplicate e-mails or
      # Stripe calls from this copy); flip to "false" at cutover.
      DISABLE_CRONS: ${DISABLE_CRONS:-false}
      JWT_SECRET: ${JWT_SECRET:?}
      APP_URL: https://omniprint.app.br
      CORS_ORIGIN: https://omniprint.app.br
      EMAIL_FROM: OmniPrint <notificacoes@omniprint.app.br>
      RESEND_API_KEY: ${RESEND_API_KEY:?}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
      STRIPE_PRODUCT_ID: ${STRIPE_PRODUCT_ID:?}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:?}
      OPS_ALERT_SECRET: ${OPS_ALERT_SECRET:?}
    volumes:
      - api_storage:/app/storage
    networks:
      internal: {}
      edge: { aliases: [omniprint-api] }
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }
    logging: *logging

  web:
    image: ghcr.io/osiristecnologiadev-lang/omni-print-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      TZ: UTC
      # Server-side only (every fetch in lib/api.ts runs on the server), so
      # the internal address skips a round trip through Caddy.
      API_BASE_URL: http://api:3000
      OPS_ALERT_SECRET: ${OPS_ALERT_SECRET:?}
    networks:
      internal: {}
      edge: { aliases: [omniprint-web] }
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }
    logging: *logging

  # One-shot: started by the host cron (see README), not kept running.
  db-backup:
    image: ghcr.io/osiristecnologiadev-lang/omni-print-db-backup:${IMAGE_TAG:-latest}
    profiles: [backup]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://omniprint:${POSTGRES_PASSWORD}@db:5432/omniprint
      API_BASE_URL: http://api:3000
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      R2_BUCKET: ${R2_BUCKET:?}
      OPS_ALERT_SECRET: ${OPS_ALERT_SECRET:?}
    # internal = reach db/api; egress = reach Cloudflare R2.
    networks: [internal, egress]
    deploy:
      resources:
        limits: { memory: 512m, cpus: "0.5" }
    logging: *logging

networks:
  # No route to the internet: db lives only here.
  internal:
    internal: true
  # Outbound internet for the backup job only.
  egress:
  # Fixed name so Vortex's Caddy can join it (`docker network connect
  # omniprint_edge vortex-caddy-1`). Only api and web are on it - never db.
  edge:
    name: omniprint_edge

volumes:
  db_data:
  api_storage:
