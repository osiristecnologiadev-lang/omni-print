# Tests everything, then builds the OmniPrint images on GitHub's runners (so the VPS, shared with
# Vortex, never spends CPU/RAM compiling) and deploys them to the VPS.
#
# The deploy job only runs when the repository VARIABLE VPS_DEPLOY_ENABLED is
# "true" - while unset, pushes only build images. Needs:
#   secrets: VPS_HOST, VPS_SSH_KEY (CI-only key, forced to deploy.sh),
#            VPS_KNOWN_HOSTS (output of `ssh-keyscan -t ed25519 <host>`)
#   vars:    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY (public key, inlined at build)
name: deploy-vps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Gate: nothing is built or deployed unless every test and type-check
  # passes (2026-11-09 - before this, a push to main went to production
  # untested).
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # The schema reads it; unit tests never connect (Prisma is mocked).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma validate && npx prisma generate
      - run: npx tsc --noEmit -p .
      - run: npx jest --ci

  # Billing math against a real Postgres+TimescaleDB (test/*.int-spec.ts),
  # after applying every migration to an empty database - a migration that
  # can't apply cleanly fails here, not on the production deploy.
  test-api-db:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omni -d omni_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://omni:omni@localhost:5432/omni_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:int -- --ci

  test-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npx vitest run

  # The panel end to end: real DB + API + panel with seeded data
  # (api/test/e2e-seed.ts), Playwright on desktop and phone. Screenshots of
  # every checked screen are kept as a build artifact for usability reviews.
  test-e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U omni -d omni_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://omni:omni@localhost:5432/omni_test
      JWT_SECRET: ci-e2e-only
      API_BASE_URL: http://localhost:4100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: API - install, migrate, seed, build
        working-directory: api
        run: |
          npm ci
          npx prisma migrate deploy
          npx ts-node --transpile-only test/e2e-seed.ts
          npx nest build
      - name: API - start
        working-directory: api
        run: PORT=4100 CORS_ORIGIN=http://localhost:3100 DISABLE_CRONS=true TZ=UTC nohup node dist/src/main.js > ../api.log 2>&1 &
      - name: Panel - install, build, start
        working-directory: web
        run: |
          npm ci
          npx next build
          PORT=3100 nohup npx next start -p 3100 > ../web.log 2>&1 &
      - name: Wait for both
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4100/v1/health >/dev/null && curl -sf -o /dev/null http://localhost:3100/login && exit 0
            sleep 2
          done
          cat api.log web.log; exit 1
      - name: Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs on failure
        if: failure()
        run: tail -100 api.log web.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            web/e2e/screenshots/
            web/test-results/
          retention-days: 14

  # The agent runs on customers' Windows PCs - test it on Windows.
  test-agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go vet ./...
        env:
          GOOS: linux

  build:
    needs: [test-api, test-api-db, test-web, test-e2e, test-agent]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: api }
          - { name: web, context: web }
          - { name: db-backup, context: ops/db-backup }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            ghcr.io/osiristecnologiadev-lang/omni-print-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/osiristecnologiadev-lang/omni-print-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    if: vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Deploy over SSH (forced command = /opt/omniprint/deploy.sh)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s' "$TOKEN" | ssh -o StrictHostKeyChecking=yes root@"$HOST" deploy "${GITHUB_SHA}"
